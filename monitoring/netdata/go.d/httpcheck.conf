# HTTP endpoint tekshiruvi — "xizmat konteynerda ishlayapti" bilan "xizmat haqiqatan
# javob beryapti" ikki xil narsa. Konteyner tirik, lekin uvicorn osilib qolgan bo'lishi
# mumkin — buni faqat shu kollektor ushlaydi.
#
# Manzillar compose XIZMAT NOMLARI orqali, ya'ni konteynerlarning ICHKI portlari
# (tashqi 8003/8010 emas) — dev va prod uchun bir xil ishlaydi.

jobs:
  # FastAPI backend. `/health` — config/main.py dagi maxsus endpoint; u
  # API_PUBLIC_PREFIX ga BOG'LIQ EMAS (prefiksli va prefiksiz ikkala yo'lda ham
  # ro'yxatdan o'tgan), shuning uchun `.env` dagi prefiks o'zgarsa ham ishlayveradi.
  # (`/docs` yaramaydi: routerlar `/api` ostida, ya'ni `/docs` → 404.)
  - name: fastapi_web
    url: 'http://web:8000/health'
    timeout: 5
    status_accepted: [200]

  # Backend bazani ko'ryaptimi. `/health` faqat "jarayon tirik" deydi, bu esa
  # haqiqiy SQL so'rov yuboradi — ulanish pooli tugaganini yoki baza yiqilganini
  # aynan shu ushlaydi.
  - name: fastapi_web_db
    url: 'http://web:8000/health/db'
    timeout: 10
    status_accepted: [200]

  # Support mikroservizi — o'zining `/health` endpoint'i bor
  # (support_service/main.py).
  - name: support_service
    url: 'http://support:8000/health'
    timeout: 5
    status_accepted: [200]

  # OSRM — marshrut hisoblash. Busiz narx hisoblash umuman ishlamaydi, shuning uchun
  # shunchaki port emas, HAQIQIY marshrut so'raladi: javobda `"code":"Ok"` bo'lishi shart.
  # (Xuddi docker-compose.yml'dagi healthcheck kabi, faqat tashqaridan.)
  - name: osrm_router
    url: 'http://osrm:5000/route/v1/driving/69.24,41.31;69.28,41.33?overview=false'
    timeout: 10
    status_accepted: [200]
    response_match: '"code":"Ok"'
