# PostgreSQL kollektori.
#
# ${...} qiymatlari `monitoring/render-config.py` tomonidan `.env` dan olinadi
# (netdata konfiguratsiya fayllarida o'zgaruvchilarni o'zi kengaytirmaydi), shuning
# uchun parol GIT'GA TUSHMAYDI — bu fayl shablon, tayyor nusxasi `.rendered/` da.
#
# Manzil sifatida compose XIZMAT NOMI (`db`) ishlatiladi: u dev'da ham, prod'da ham
# bir xil, chunki prod stack bazaviy `docker-compose.yml` ustiga qo'yiladi.
# Agar serverda Postgres konteynerda emas, HOST mashinada bo'lsa — `db:5432` ni
# `host.docker.internal:5432` ga almashtiring (docs/MONITORING.md ga qarang).
#
# Foydalanuvchi: standart holda ilovaning o'zining DB_USER'i ishlatiladi. Xavfsizroq
# variant — faqat-o'qish uchun alohida rol (docs/MONITORING.md, 2-bosqich):
#   CREATE USER netdata WITH PASSWORD '...'; GRANT pg_monitor TO netdata;
# So'ng .env da NETDATA_PG_USER / NETDATA_PG_PASSWORD ni to'ldiring.

jobs:
  - name: logistika_db
    dsn: 'postgres://${NETDATA_PG_USER:-${DB_USER:-postgres}}:${NETDATA_PG_PASSWORD:-${DB_PASSWORD}}@${NETDATA_PG_HOST:-db}:5432/${DB_NAME:-logistika_db}?sslmode=disable'
    timeout: 5
    # `collect_databases_matching` ATAYLAB berilmagan (standart holda o'chiq): u har bir
    # baza ichidagi jadval va indekslar bo'yicha statistika yig'adi — bu bizga kerak emas
    # va katta bazada Postgres'ning o'ziga yuk beradi. Ulanishlar, tranzaksiyalar,
    # cache hit-rate, replikatsiya, locklar — hammasi busiz ham keladi.
