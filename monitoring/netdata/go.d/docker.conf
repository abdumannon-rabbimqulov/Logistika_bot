# Docker daemon kollektori — konteynerlar soni, holati va healthcheck natijasi.
#
# Har bir konteynerning CPU/RAM/tarmoq grafiklari bundan EMAS, `cgroups` plaginidan
# keladi (netdata.conf'da yoqilgan) — u konteyner nomlarini `docker.sock` orqali
# aniqlaydi, shuning uchun grafiklar `logistika_web_prod` kabi nomlar bilan ko'rinadi.
#
# Bu kollektor esa umumiy manzarani beradi: nechta konteyner ishlayapti, nechtasi
# to'xtagan, nechtasi "unhealthy". `health.d/logistika.conf` dagi alertlar shunga tayanadi.

jobs:
  - name: local
    address: 'unix:///var/run/docker.sock'
    timeout: 5
    # Har bir konteynerning image'ida yangilanish bor-yo'qligini tekshirish —
    # sekin va bu yerda kerak emas.
    collect_container_size: no
