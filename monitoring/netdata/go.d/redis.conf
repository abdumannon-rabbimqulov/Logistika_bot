# Redis kollektori — xotira, kalitlar soni, hit-rate, ulanishlar.
#
# Xizmat nomi `logistika-redis` (docker-compose.yml). Konteyner ichida port 6379
# (tashqariga 6380 sifatida chiqadi — bu yerda ichki port kerak).
# Redis host mashinada bo'lsa: NETDATA_REDIS_HOST=host.docker.internal

jobs:
  - name: logistika_redis
    address: 'redis://${NETDATA_REDIS_PASSWORD:-}@${NETDATA_REDIS_HOST:-logistika-redis}:${NETDATA_REDIS_PORT:-6379}'
    timeout: 5
