# RabbitMQ kollektori — navbat uzunligi, "unacked" xabarlar, ulanishlar.
#
# Aynan shu joy dispatch tizimining "termometri": `logistika.dispatch` navbati
# o'sib ketsa — worker'lar ulgurmayapti (`make worker-scale n=3` kerak),
# "unacked" o'sib ketsa — worker osilib qolgan.
#
# Boshqaruv plagini API'si (15672) ishlatiladi — `rabbitmq:3.13-management-alpine`
# image'ida u yoqilgan.

jobs:
  - name: logistika_rabbitmq
    url: 'http://${NETDATA_RABBITMQ_HOST:-rabbitmq}:15672'
    username: '${RABBITMQ_USER:-guest}'
    password: '${RABBITMQ_PASSWORD:-guest}'
    timeout: 5
    collect_queues_metrics: yes
