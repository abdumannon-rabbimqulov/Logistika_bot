# Netdata — asosiy sozlama (yengillashtirilgan).
#
# Bu fayl `monitoring/render-config.py` orqali `monitoring/.rendered/` ga ko'chiriladi
# va konteynerga `/etc/netdata/netdata.conf` sifatida read-only mount qilinadi.
# Ya'ni konteyner ichida `edit-config` bilan tahrirlash SHART EMAS — shu faylni
# o'zgartirib `make mon-restart` qilinadi (va o'zgarish git'da qoladi).
#
# Maqsad: kichik VPS'da ~100 MB RAM va 1-3% CPU dan oshmaslik. Netdata standart
# sozlamada har soniyada, mashinali o'qitish (ML) anomaliya detektori bilan ishlaydi
# — bu loyiha uchun ortiqcha.

[global]
    # 1 soniya emas, 2 soniya — CPU iste'moli ikki barobar kamayadi, grafiklar esa
    # baribir "jonli" ko'rinadi.
    update every = 2

[db]
    mode = dbengine
    # Tarix uchun disk chegarasi. 256 MB ≈ 3-4 kunlik ma'lumot (2s aniqlikda).
    # Ko'proq tarix kerak bo'lsa shu raqamni oshiring.
    dbengine multihost disk space MB = 256

[ml]
    # Anomaliya detektori — doimiy CPU yeydi va bu yerda kerak emas:
    # bizga aniq chegaralar (disk to'ldi, konteyner o'chdi) yetarli.
    enabled = no

[health]
    enabled = yes
    # Alert holati o'zgarganda Telegram'ga xabar (health_alarm_notify.conf).
    script to execute on alarm = /usr/libexec/netdata/plugins.d/alarm-notify.sh

[web]
    # Konteyner ICHIDAGI manzil. Tashqariga chiqish docker-compose'dagi
    # `127.0.0.1:19999:19999` bilan cheklangan — server IP'sidan ochilmaydi.
    bind to = 0.0.0.0:19999
    # Netdata Cloud'ga ulanmaymiz, panel faqat SSH tunnel orqali ochiladi.
    allow dashboard from = *
    allow badges from = *

[plugins]
    # DIQQAT: bu faylda QATOR OXIRIDA izoh yozib bo'lmaydi. netdata qiymatni qator
    # oxirigacha o'qiydi, ya'ni `cgroups = yes  # izoh` → qiymat "yes  # izoh" bo'lib
    # qoladi va plagin JIMGINA o'chib qoladi (xato ham yozilmaydi). Izoh faqat
    # alohida qatorda, `#` bilan boshlanishi kerak.
    proc = yes
    diskspace = yes
    # cgroups — har bir Docker konteynerining CPU/RAM/tarmoq grafiklari shundan keladi
    cgroups = yes
    # go.d — postgres/redis/rabbitmq/docker/httpcheck kollektorlari
    go.d = yes
    apps = yes
    # Keraksizlari — o'chirilgan (CPU va RAM tejaladi)
    slabinfo = no
    perf = no
    charts.d = no
    python.d = no
    ebpf = no
    timex = no

[plugin:apps]
    update every = 5
