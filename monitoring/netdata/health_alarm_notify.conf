# Alert xabarnomalari — faqat Telegram.
#
# Bu fayl netdata'ning katta stok `health_alarm_notify.conf` fayli o'rniga MOUNT
# qilinadi, shuning uchun bu yerda faqat kerakli sozlamalar bor: qolgan barcha
# kanallar (email, slack, discord, ...) berilmagan = o'chirilgan.
#
# Token `.env` dan `monitoring/render-config.py` orqali qo'yiladi — git'ga tushmaydi.
# MONITORING_TG_TOKEN bo'sh bo'lsa xabar yuborilmaydi (netdata jimgina o'tkazib yuboradi).

# curl netdata image'ida mavjud
curl=""
sendmail=""

# ── Telegram ────────────────────────────────────────────────────────────────
SEND_TELEGRAM="YES"
TELEGRAM_BOT_TOKEN="${MONITORING_TG_TOKEN:-}"
DEFAULT_RECIPIENT_TELEGRAM="${MONITORING_TG_CHAT_ID:-}"

# ── Boshqa kanallar — o'chirilgan ───────────────────────────────────────────
SEND_EMAIL="NO"
SEND_SLACK="NO"
SEND_DISCORD="NO"
SEND_PUSHOVER="NO"
SEND_PUSHBULLET="NO"
SEND_TWILIO="NO"
SEND_MESSAGEBIRD="NO"
SEND_KAVENEGAR="NO"
SEND_HIPCHAT="NO"
SEND_MATRIX="NO"
SEND_ROCKETCHAT="NO"
SEND_ALERTA="NO"
SEND_FLOCK="NO"
SEND_IRC="NO"
SEND_AWSSNS="NO"
SEND_SYSLOG="NO"
SEND_CUSTOM="NO"
SEND_MSTEAM="NO"
SEND_PD="NO"
SEND_FLEEP="NO"
SEND_PROWL="NO"
SEND_OPSGENIE="NO"
SEND_DYNATRACE="NO"
SEND_STACKPULSE="NO"
SEND_GOTIFY="NO"
SEND_NTFY="NO"

# ── Qaysi alertlar yuborilsin ───────────────────────────────────────────────
# CLEAR (muammo bartaraf bo'ldi) xabarlari ham keladi — muammo o'zi hal bo'lganini
# bilish uchun foydali. "NO" qilinsa faqat muammo boshlanishi haqida xabar keladi.
SEND_CLEAR_NOTIFICATIONS="YES"

# `role_recipients_telegram[...]` berilmagan — barcha rollar (sysadmin, dba, webmaster,
# proxyadmin) DEFAULT_RECIPIENT_TELEGRAM ga tushadi.
