# Logistika loyihasiga xos alertlar.
#
# Netdata'ning O'ZIDA disk to'lishi, RAM tugashi, CPU/IO bo'g'ilishi, swap va tarmoq
# xatolari uchun tayyor alertlar bor — ularni takrorlamaymiz. Bu yerda faqat shu
# stack'ka tegishli holatlar.
#
# MUHIM SINTAKSIS QOIDALARI (ikkalasi ham jimgina ishlamay qo'yishga olib keladi):
#   1. `template:` ishlatiladi, `alarm:` emas. `alarm:` da `on:` — grafikning ANIQ
#      id'si bo'lishi kerak (`docker_local.containers_state`), u esa job nomiga bog'liq.
#      `template:` da esa `on:` — KONTEKST (`docker.containers_state`), ya'ni job nomi
#      o'zgarsa ham alert ishlayveradi. Konteкstlarni ko'rish:
#        curl -s localhost:19999/api/v1/charts | grep context
#   2. Qator oxirida izoh yozib bo'lmaydi — faqat alohida qatorda.
#
# `to: sysadmin` — health_alarm_notify.conf dagi standart qabul qiluvchi (Telegram).

# ── 1. Ishlab turgan konteynerlar soni kamayib ketdi ────────────────────────
# Kutilgan son .env dagi MONITORING_EXPECTED_CONTAINERS bilan beriladi.
# Aniq raqamni serverda `docker ps -q | wc -l` ko'rsatadi.
# DIQQAT: bu HOSTDAGI BARCHA konteynerlarni sanaydi (monitoring stack'ning o'zi ham
# kiradi), faqat shu loyihanikini emas.
 template: logistika_containers_down
       on: docker.containers_state
    class: Errors
     type: Containers
component: Docker
   lookup: min -1m unaligned of running
    units: containers
    every: 20s
     warn: $this < ${MONITORING_EXPECTED_CONTAINERS:-10}
     crit: $this < ${MONITORING_CRITICAL_CONTAINERS:-8}
    delay: down 5m
     info: Ishlab turgan konteynerlar soni kutilganidan kam - biror xizmat ochgan
       to: sysadmin

# ── 2. Healthcheck "unhealthy" bergan konteyner bor ─────────────────────────
# osrm, rabbitmq, db, support, frontend da healthcheck bor. "unhealthy" - konteyner
# tirik, lekin ishlamayapti (masalan OSRM xaritani yuklay olmagan).
 template: logistika_containers_unhealthy
       on: docker.containers_health_status
    class: Errors
     type: Containers
component: Docker
   lookup: max -1m unaligned of unhealthy
    units: containers
    every: 20s
     warn: $this > 0
    delay: down 5m
     info: Kamida bitta konteyner healthcheck dan otmayapti
       to: sysadmin

# ── 3. HTTP endpoint javob bermayapti ───────────────────────────────────────
# go.d/httpcheck.conf dagi har bir job uchun alohida ishlaydi: fastapi_web (/health),
# fastapi_web_db (/health/db), support_service (/health), osrm_router (haqiqiy marshrut).
# Konteyner tirik, lekin uvicorn osilib qolgan holatni aynan shu ushlaydi.
 template: logistika_endpoint_unreachable
       on: httpcheck.status
    class: Errors
     type: Web Server
component: HTTP endpoint
   lookup: average -1m unaligned percentage of success
    units: %
    every: 10s
     warn: $this < 75
     crit: $this < 40
    delay: down 5m
     info: HTTP endpoint sorovlarning bir qismiga javob bermayapti
       to: sysadmin

# ── 4. Navbat o'sib ketdi ───────────────────────────────────────────────────
# Har bir RabbitMQ navbati uchun alohida (dispatch.jobs, support.notifications, ...).
# Haydovchi qidirish vazifalari worker'lardan tezroq kelayotgan bo'lsa navbat
# to'planadi va buyurtmalar kechikib qayta ishlanadi. Yechim: `make worker-scale n=3`.
 template: logistika_queue_backlog
       on: rabbitmq.queue_messages_count
    class: Workload
     type: Messaging
component: RabbitMQ
   lookup: average -2m unaligned of ready
    units: messages
    every: 30s
     warn: $this > ${MONITORING_QUEUE_WARN:-50}
     crit: $this > ${MONITORING_QUEUE_CRIT:-200}
    delay: down 10m
     info: Navbatda xabarlar toplanib qoldi - worker lar ulgurmayapti
       to: sysadmin

# ── 5. Postgres ulanishlari limitga yaqinlashdi ─────────────────────────────
# asyncpg pool + bot + worker'lar birgalikda `max_connections` ni yeb qo'yishi mumkin;
# limitga yetganda ilova "too many clients" bilan yiqiladi.
 template: logistika_pg_connections
       on: postgres.connections_utilization
    class: Utilization
     type: Database
component: PostgreSQL
   lookup: average -1m unaligned of used
    units: %
    every: 30s
     warn: $this > 75
     crit: $this > 90
    delay: down 5m
     info: PostgreSQL ulanishlari limitga yaqinlashdi
       to: sysadmin
