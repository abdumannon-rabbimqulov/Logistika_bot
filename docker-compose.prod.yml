services:
  web:
    build: .
    container_name: logistika_web_prod
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - FORCE_COLOR=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - config.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --log-config
      - config/uvicorn_logging.json
    restart: always

  bot:
    build: .
    container_name: logistika_bot_prod
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python main.py
    restart: always
