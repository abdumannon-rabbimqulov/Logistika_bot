<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistika AI - Login Response</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); width: 90%; max-width: 500px; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; text-align: center; }
        #status { text-align: center; margin-bottom: 1rem; font-weight: 500; }
        .loading { color: #fbbf24; }
        .success { color: #4ade80; }
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(248, 113, 113, 0.2); }
        pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; border: 1px solid #334155; color: #38bdf8; }
        .label { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Logistika AI WebApp</h2>
        <div id="status">Telegram ma'lumotlari kutilmoqda...</div>
        <div id="response-container" style="display: none;">
            <span class="label">Server Response:</span>
            <pre id="response-data"></pre>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const statusEl = document.getElementById('status');
        const responseContainer = document.getElementById('response-container');
        const responseData = document.getElementById('response-data');

        async function performLogin(initData) {
            statusEl.className = 'loading';
            statusEl.textContent = '🔄 Login so\'rovi yuborilmoqda...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                statusEl.className = 'success';
                statusEl.textContent = '✅ Muvaffaqiyatli login!';
                
                responseContainer.style.display = 'block';
                responseData.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Xato: ' + error.message;
            }
        }

        window.onload = () => {
            tg.ready();
            tg.expand();
            
            if (tg.initData) {
                performLogin(tg.initData);
            } else {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Telegram WebApp muhiti topilmadi';
            }
        };
    </script>
</body>
</html>
