<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistika Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="wrapper">
        <header>
            <div class="logo">
                <span class="icon">🛡️</span>
                <h1>Admin Panel</h1>
            </div>
            <div id="admin-info" class="admin-profile">
                <span id="admin-name">Yuklanmoqda...</span>
            </div>
        </header>

        <main>
            <section class="stats-grid">
                <div class="stat-card" id="tab-users">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <h3>Foydalanuvchilar</h3>
                        <p id="total-users">0</p>
                    </div>
                </div>
                <div class="stat-card" id="tab-truck-types">
                    <div class="stat-icon">🚛</div>
                    <div class="stat-info">
                        <h3>Mashina Turlari</h3>
                        <p id="truck-types-count">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📦</div>
                    <div class="stat-info">
                        <h3>Buyurtmalar</h3>
                        <p id="orders-count">0</p>
                    </div>
                </div>
            </section>

            <section class="content-section" id="section-users">
                <div class="section-header">
                    <h2>Foydalanuvchilarni Boshqarish</h2>
                    <button class="btn-secondary refresh-btn">♻️ Yangilash</button>
                </div>
                
                <div class="table-container">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ism</th>
                                <th>Username</th>
                                <th>Rol</th>
                                <th>Holat</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <!-- JS orqali to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="content-section" id="section-truck-types" style="display: none;">
                <div class="section-header">
                    <h2>Yuk Mashinalari Turlari</h2>
                    <button id="add-truck-type-btn" class="btn-primary">➕ Yangi Qo'shish</button>
                </div>

                <div class="table-container">
                    <table id="truck-types-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nomi</th>
                                <th>Maks. Vazn</th>
                                <th>Maks. Hajm</th>
                                <th>Amallar</th>
                            </tr>
                        </thead>
                        <tbody id="truck-types-tbody">
                            <!-- JS orqali to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Modal for adding truck type -->
            <div id="truck-modal" class="modal">
                <div class="modal-content">
                    <h3>Yangi Mashina Turi</h3>
                    <form id="truck-type-form">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Nomi (masalan: Isuzu)" required>
                        </div>
                        <div class="form-group">
                            <input type="number" step="0.1" name="max_weight" placeholder="Maks. Vazn (tonna)" required>
                        </div>
                        <div class="form-group">
                            <input type="number" step="0.1" name="max_volume" placeholder="Maks. Hajm (m3)" required>
                        </div>
                        <div class="form-group">
                            <textarea name="description" placeholder="Tavsif (ixtiyoriy)"></textarea>
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn-secondary" id="close-modal">Bekor qilish</button>
                            <button type="submit" class="btn-primary">Saqlash</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
