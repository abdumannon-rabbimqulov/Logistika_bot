server {
    server_name logistic.org.uz www.logistic.org.uz;

    # Backend API (All routes)
    location / {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets from Backend (uploads)
    location /static/uploads {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/logistic.org.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logistic.org.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.logistic.org.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = logistic.org.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name logistic.org.uz www.logistic.org.uz;
    return 404; # managed by Certbot
}
