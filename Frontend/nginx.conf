server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mavjud bo'lmagan fayl/marshrut so'ralsa ham index.html qaytariladi
    # (React Router client-side navigatsiya qilishi uchun, masalan /orders/5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'langan build fayllari (assets/*) uzoq muddat keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
