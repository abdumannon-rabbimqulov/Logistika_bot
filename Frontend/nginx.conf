server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API'ga proxy — frontend va API bir xil origin'da bo'lishi uchun
    # (Telegram WebApp HTTPS talab qiladi; VITE_API_BASE_URL=/api build vaqtida
    # shu maqsadda nisbiy manzil sifatida beriladi). `host.docker.internal` orqali
    # host mashinadagi backend (port 8000, docker-compose.yml'dagi "web" xizmati)ga boradi.
    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: mavjud bo'lmagan fayl/marshrut so'ralsa ham index.html qaytariladi
    # (React Router client-side navigatsiya qilishi uchun, masalan /orders/5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'langan build fayllari (assets/*) uzoq muddat keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
