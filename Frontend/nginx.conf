# OSRM so'rovlari uchun tezlik chegarasi. Bu fayl `/etc/nginx/conf.d/default.conf`
# ga ko'chiriladi, ya'ni `http` konteksti ichida — `limit_req_zone` aynan shu yerda
# e'lon qilinishi kerak (server bloki ichida ruxsat etilmaydi).
#
# NEGA KERAK: `/osrm/` marshrut hisoblashni internetga ochadi va har bir so'rov
# OSRM'da sezilarli CPU yeydi. Cheklovsiz qoldirilsa, bitta skript bilan butun
# serverni bo'g'ib qo'yish mumkin. 5 r/s + 10 ta portlash zaxirasi oddiy
# foydalanuvchi uchun mo'l-ko'l (bir sahifada 1 ta so'rov).
limit_req_zone $binary_remote_addr zone=osrm_limit:10m rate=5r/s;

# Original protokolni backendga yetkazish. Prod'da TLS ni Caddy tugatadi va bu
# nginx'ga oddiy HTTP orqali murojaat qiladi — ya'ni `$scheme` bu yerda doim
# "http". Agar backendga shuni bersak, u o'zini HTTPS ostida ekanini bilmaydi
# (absolyut havolalar va redirect'lar http bo'lib chiqadi). Shuning uchun Caddy
# qo'ygan `X-Forwarded-Proto` bor bo'lsa — o'sha uzatiladi, bo'lmasa (to'g'ridan
# -to'g'ri murojaat, lokal sinov) `$scheme` ga qaytiladi.
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BARCHA upstream'lar o'zgaruvchi orqali beriladi va nom ish vaqtida hal qilinadi.
    #
    # NEGA: `proxy_pass http://web:8000` deb to'g'ridan-to'g'ri yozilsa, nginx nomni
    # ISHGA TUSHISHDA hal qiladi. `web` (yoki `osrm`) hali ko'tarilmagan bo'lsa nginx
    # "host not found in upstream" bilan yiqiladi va qayta ishga tushish tsikliga
    # tushadi — bu loyihada ilgari aynan shu muammo bo'lgan. O'zgaruvchi ishlatilganda
    # nom har so'rovda Docker'ning ichki DNS'i (127.0.0.11) orqali hal qilinadi, ya'ni
    # xizmat keyinroq ko'tarilsa ham nginx uni topadi.
    # `$request_uri` HAM SHART. proxy_pass'da o'zgaruvchi ishlatilganda nginx
    # location prefiksini almashtirish mantig'ini QO'LLAMAYDI: `proxy_pass
    # $web_backend/api/;` deyilsa har bir so'rov backendga aynan `/api/` bo'lib
    # boradi va yo'lning qolgan qismi (`health`, `orders/5`, ...) yo'qoladi.
    # `$request_uri` esa so'rov manzilini so'roq belgisi bilan birga to'liq uzatadi.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web_backend     "http://web:8000";
    set $support_backend "http://support:8000";
    set $osrm_backend    "http://osrm:5000";

    # Backend API'ga proxy — frontend va API bir xil origin'da bo'lishi uchun
    # (Telegram WebApp HTTPS talab qiladi; VITE_API_BASE_URL=/api build vaqtida
    # shu maqsadda nisbiy manzil sifatida beriladi). `web` — docker-compose
    # tarmog'idagi xizmat nomi, port 8000 (konteyner ichidagi, host'dagi emas).
    # WebSocket yo'llari — Upgrade sarlavhalari alohida berilishi shart, aks holda
    # ulanish oddiy HTTP so'rov sifatida uzatilib darhol uziladi.
    # 1) haydovchining jonli GPS oqimi (driver/router.py `/drivers/ws/location`)
    # 2) admin panelidagi jonli xarita (Admin_panel/router.py `/system/drivers/locations/stream`)
    location /api/drivers/ws/ {
        proxy_pass $web_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/system/drivers/locations/stream {
        proxy_pass $web_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 3) sender'ning jonli kuzatuv oqimi (order/router.py `/orders/{id}/ws/driver-location`).
    # Bu blok yetishmasdi: so'rov quyidagi umumiy `location /api/` ga tushib, Upgrade
    # sarlavhalarisiz uzatilardi. Natijada WS darhol uzilib, frontend jimgina 10 soniyalik
    # pollingga tushardi (Frontend/src/hooks/useOrderDriverLocation.ts). `~` regexp kerak,
    # chunki o'rtada o'zgaruvchan buyurtma raqami turadi.
    location ~ ^/api/orders/\d+/ws/driver-location$ {
        proxy_pass $web_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Support mikroservisi — alohida konteyner. Uning yo'llari `/api` ostida emas,
    # o'zining `/support` prefiksida. Shu blok bo'lmasa SPA murojaatlar (ticket)
    # bo'limiga umuman ulana olmaydi. Konteyner ichida u ham 8000-portda ishlaydi
    # (host'ga 8010 sifatida chiqadi, lekin bu yerda ichki port kerak).
    location /support/ {
        proxy_pass $support_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        proxy_pass $web_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Transport turi rasmi va h.k. yuklanadi — standart 1 MB juda kichik.
        client_max_body_size 25m;
    }

    # Yuklangan fayllar (transport turi rasmlari va h.k.) — backend `/static/uploads`
    # ostida beradi (config/main.py: app.mount(STATIC_PATH, StaticFiles(...))). Bu
    # proxy bo'lmasa admin panelda yuklangan rasm ko'rinmaydi (SPA fallback index.html
    # qaytarardi).
    location /static/ {
        proxy_pass $web_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # OSRM — buyurtma sahifasidagi Leaflet xaritasi (Leaflet Routing Machine)
    # marshrutni BRAUZERDAN so'raydi, shuning uchun OSRM'ga yo'l ochilishi kerak.
    #
    # ATAYLAB TOR: regexp faqat `route/v1/driving/...` ni o'tkazadi. OSRM'ning
    # boshqa xizmatlari (`/table` — matritsa, `/trip` — kommivoyajyor masalasi,
    # `/tile`) ochilmaydi: ular ancha qimmat va bizga kerak emas. Boshqa har qanday
    # `/osrm/...` so'rovi quyidagi SPA fallback'ga tushib 404 oladi.
    #
    # OSRM PORTI TASHQARIGA OCHILMAYDI: bu konteyner (nginx) OSRM bilan bitta
    # compose tarmog'ida, shuning uchun unga xizmat nomi orqali boradi.
    location ~ ^/osrm/(route/v1/driving/.+)$ {
        limit_req zone=osrm_limit burst=10 nodelay;
        # Faqat o'qish — OSRM baribir POST qabul qilmaydi, lekin buni sarhad
        # darajasida ham aytib qo'ygan ma'qul.
        limit_except GET { deny all; }

        proxy_pass $osrm_backend/$1$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Marshrut o'zgarmaydi — brauzer keshlasin (bir xil A→B qayta so'ralmasin).
        proxy_read_timeout 15s;
        add_header Cache-Control "public, max-age=3600";
    }

    # Yuqoridagi regexp'ga tushmagan har qanday `/osrm/...` (masalan `/osrm/table/v1/...`
    # yoki `/osrm/tile/...`) shu yerda to'xtaydi. Bu blok bo'lmasa ular quyidagi SPA
    # fallback'ga tushib, JSON kutayotgan mijozga `index.html` qaytarardi —
    # "bloklandi" degani "OSRM ishlamayapti" bilan chalkashib ketardi.
    location /osrm/ {
        return 404;
    }

    # SPA: mavjud bo'lmagan fayl/marshrut so'ralsa ham index.html qaytariladi
    # (React Router client-side navigatsiya qilishi uchun, masalan /orders/5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'langan build fayllari (assets/*) uzoq muddat keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
