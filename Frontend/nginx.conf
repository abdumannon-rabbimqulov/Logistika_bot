server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API'ga proxy — frontend va API bir xil origin'da bo'lishi uchun
    # (Telegram WebApp HTTPS talab qiladi; VITE_API_BASE_URL=/api build vaqtida
    # shu maqsadda nisbiy manzil sifatida beriladi). `host.docker.internal` orqali
    # host mashinadagi backend (port 8000, docker-compose.yml'dagi "web" xizmati)ga boradi.
    # WebSocket yo'llari — Upgrade sarlavhalari alohida berilishi shart, aks holda
    # ulanish oddiy HTTP so'rov sifatida uzatilib darhol uziladi.
    # 1) haydovchining jonli GPS oqimi (driver/router.py `/drivers/ws/location`)
    # 2) admin panelidagi jonli xarita (Admin_panel/router.py `/system/drivers/locations/stream`)
    location /api/drivers/ws/ {
        proxy_pass http://host.docker.internal:8000/api/drivers/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/system/drivers/locations/stream {
        proxy_pass http://host.docker.internal:8000/api/system/drivers/locations/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 3) sender'ning jonli kuzatuv oqimi (order/router.py `/orders/{id}/ws/driver-location`).
    # Bu blok yetishmasdi: so'rov quyidagi umumiy `location /api/` ga tushib, Upgrade
    # sarlavhalarisiz uzatilardi. Natijada WS darhol uzilib, frontend jimgina 10 soniyalik
    # pollingga tushardi (Frontend/src/hooks/useOrderDriverLocation.ts). `~` regexp kerak,
    # chunki o'rtada o'zgaruvchan buyurtma raqami turadi.
    location ~ ^/api/orders/\d+/ws/driver-location$ {
        # `proxy_pass` ATAYLAB URI qismisiz: shunda nginx so'rov manzilini o'zgartirmasdan
        # uzatadi (regexp location'da URI berish mumkin ham emas). `$request_uri` kabi
        # o'zgaruvchi yozilsa nginx domenni ish vaqtida hal qilishga o'tib, `resolver`
        # talab qilardi va konteyner ishga tushmasdi.
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Support mikroservisi — alohida konteyner, alohida port (8010). Uning yo'llari
    # `/api` ostida emas, o'zining `/support` prefiksida. Shu blok bo'lmasa SPA
    # murojaatlar (ticket) bo'limiga umuman ulana olmaydi.
    location /support/ {
        proxy_pass http://host.docker.internal:8010/support/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Yuklangan fayllar (transport turi rasmlari va h.k.) — backend `/static/uploads`
    # ostida beradi (config/main.py: app.mount(STATIC_PATH, StaticFiles(...))). Bu
    # proxy bo'lmasa admin panelda yuklangan rasm ko'rinmaydi (SPA fallback index.html
    # qaytarardi).
    location /static/ {
        proxy_pass http://host.docker.internal:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: mavjud bo'lmagan fayl/marshrut so'ralsa ham index.html qaytariladi
    # (React Router client-side navigatsiya qilishi uchun, masalan /orders/5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'langan build fayllari (assets/*) uzoq muddat keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
