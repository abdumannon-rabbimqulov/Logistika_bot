services:
  db:
    image: postgres:15-alpine
    container_name: logistika_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2103}
      POSTGRES_DB: logistika_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-api:
    build: .
    container_name: logistika_api
    command: uvicorn config.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-2103}@db:5432/logistika_db
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - ADMIN=${ADMIN}
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY}
    depends_on:
      db:
        condition: service_healthy

  backend-bot:
    build: .
    container_name: logistika_bot
    command: python main.py
    volumes:
      - .:/app
    environment:
      - DB_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-2103}@db:5432/logistika_db
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - ADMIN=${ADMIN}
      - API_KEY=${API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./logistika-ui
    container_name: logistika_frontend
    volumes:
      - ./logistika-ui:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend-api

volumes:
  postgres_data:
