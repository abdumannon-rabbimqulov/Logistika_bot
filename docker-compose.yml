x-backend-base: &backend-base
  build: .
  env_file:
    - .env
  environment:
    - DB_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-2103}@db:5432/${DB_NAME:-logistika_db}
  volumes:
    - .:/app
    - uploads_data:/app/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    container_name: logistika_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2103}
      POSTGRES_DB: ${DB_NAME:-logistika_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-logistika_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  migrations:
    <<: *backend-base
    container_name: logistika_migrations
    command: alembic upgrade head
    restart: on-failure

  backend-api:
    <<: *backend-base
    container_name: logistika_api
    command: uvicorn config.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  backend-bot:
    <<: *backend-base
    container_name: logistika_bot
    command: python main.py
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
