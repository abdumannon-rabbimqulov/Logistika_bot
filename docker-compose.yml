version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2103
      - POSTGRES_DB=logistika_db
      - TZ=Asia/Toshkent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  web:
    build: .
    container_name: fastapi_web_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    restart: always
    depends_on:
      - db

  bot:
    build: .
    container_name: aiogram_telegram_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python main.py
    restart: always
    depends_on:
      - db
volumes:
  postgres_data: