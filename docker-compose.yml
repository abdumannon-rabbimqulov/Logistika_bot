services:
  # 1. PostgreSQL bazasi
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida belgilanishi shart}
      - POSTGRES_DB=${DB_NAME:-logistika_db}
      - TZ=Asia/Tashkent
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistika_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis server
  logistika-redis:
    image: redis:7-alpine
    container_name: logistika-redis
    restart: always
    ports:
      - "6380:6379"  # Tashqi portni 6380 qildik, shunda Mac-dagi eski Redis bilan urishmaydi!
    volumes:
      - redis_data:/data

  # 3. OSRM Router (Xarita serveri)
  #
  # Ma'lumot fayllari `osrm-data/` da (git'ga kirmaydi, ~1 GB). Nomi doim "uzbekistan"
  # — sanasiz, shuning uchun xaritani yangilaganda bu faylni tahrirlash SHART EMAS
  # (`scripts/update-osrm-map.sh` fayllarni shu nom bilan almashtiradi). Qaysi sana
  # yuklanganini `osrm-data/VERSION` dan ko'rish mumkin.
  osrm:
    image: osrm/osrm-backend
    container_name: osrm_router
    platform: linux/amd64        # Apple Silicon Mac-lar uchun majburiy
    volumes:
      # Faqat xarita papkasi va faqat o'qish uchun — ilgari butun loyiha (`.:/data`)
      # ulangan edi, ya'ni .env (BOT_TOKEN, DB_PASSWORD) ham konteynerga ochiq edi.
      - ./osrm-data:/data:ro
    ports:
      - "5001:5000"              # Tashqi portni 5001 qildik, AirPlay bilan urishmaydi!
    # MLD algoritmi .osrm fayllarini o'qiydi (.osm.pbf emas — u faqat manba).
    command: osrm-routed --algorithm mld /data/uzbekistan.osrm
    restart: always
    # `restart: always` faqat jarayon o'lsa qayta ishga tushiradi — osilib qolsa (javob
    # bermay turaveradi) bilmaydi. Healthcheck aynan shuni ushlaydi va `service_healthy`
    # bog'liqligini ishlashga imkon beradi.
    # osrm/osrm-backend image'ida curl/wget/nc yo'q — faqat bash bor, shuning uchun
    # HTTP so'rov bash'ning /dev/tcp imkoniyati orqali yuboriladi. Haqiqiy marshrut
    # so'raladi (shunchaki port ochiqligi emas), ya'ni xarita to'g'ri yuklanganini ham tekshiradi.
    # MUHIM: HTTP/1.1 + "Connection: close" — OSRM aks holda ulanishni ~5s keep-alive
    # bilan ochiq ushlab turadi va `grep` javob oxirini (EOF) kutib timeout'ga uchraydi.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /route/v1/driving/69.24,41.31;69.28,41.33?overview=false HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q ''"code":"Ok"'' <&3'
      interval: 30s
      timeout: 5s
      start_period: 60s        # katta xarita sekin ochilsa ulgurishi uchun
      retries: 3

  # 4. FastAPI Web dasturi
  web:
    build: .
    container_name: fastapi_web_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - FORCE_COLOR=1
    command:
      - uvicorn
      - config.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # DIQQAT: bu yerda --reload YO'Q. Reloader qo'shimcha kuzatuvchi jarayon ochadi va
      # har qayta yuklanishda jarayon ichidagi asyncio tasklari (dispatch taymerlari —
      # services/dispatch.py `_expire_after_timeout`) yo'qoladi. Lokal ishlab chiqish
      # uchun `docker-compose.override.yml` da --reload qo'shilgan (u avtomatik qo'llanadi).
    restart: always
    depends_on:
      db:
        condition: service_healthy
      logistika-redis:
        condition: service_started
      osrm:
        # service_started emas: konteyner ko'tarilishi bilan OSRM hali marshrut
        # bera olmasligi mumkin — healthcheck o'tguncha kutiladi.
        condition: service_healthy

  # 5. Frontend (Vite dev server — hot reload) → http://localhost:5173
  #
  # Kod host'dan bind-mount qilingan, shuning uchun faylni saqlash bilanoq HMR orqali
  # brauzerda aks etadi — image'ni qayta build qilish shart emas.
  #
  # DIQQAT — ishlab chiqish paytida AYNAN shu port (5173) ochilishi kerak.
  # `Frontend/docker-compose.yml` dagi `yuk_frontend` (nginx, port 8080) BOSHQA xizmat:
  # u image ichiga "qotirilgan" statik `dist/` ni beradi, shuning uchun u yerda har bir
  # o'zgarish uchun qayta build kerak bo'ladi — bu kutilgan holat, nosozlik emas.
  # Lokalda ikkalasini birdan ishlatmang: ikki port ikki xil kodni ko'rsatadi.
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: yuk_frontend_dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      # Manba kod: host'dagi o'zgarish darhol konteynerga tushadi.
      - ./Frontend:/app
      # Anonim volume — image ichidagi node_modules host'dagi papka bilan
      # "yopilib qolmasligi" uchun (host'da node_modules bo'lmasa ham ishlaydi).
      #
      # TUZOQ: `docker compose up -d --build frontend` image'ni qayta quradi, lekin
      # MAVJUD anonim volume'ni qayta ishlatadi — ya'ni `package.json` ga qo'shilgan
      # yangi paket konteynerga umuman yetib bormaydi va Vite "Failed to resolve import"
      # deb chalg'ituvchi xato beradi. Paket qo'shgandan keyin shu buyruq kerak:
      #   docker compose up -d --build --renew-anon-volumes frontend
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Polling ATAYLAB o'chirilgan. Eski Docker Desktop bind-mount'da fayl hodisalarini
      # (inotify) yetkazmasdi, shuning uchun chokidar 300ms'da har bir faylni qayta
      # tekshirib turardi — bu bekorga CPU yeydi. Hozirgi Docker Desktop (VirtioFS)
      # hodisalarni to'g'ri uzatadi va HMR polling'siz ham ishlaydi (tekshirilgan).
      #
      # Agar biror muhitda (eski Docker, Windows/WSL1, tarmoq disk) fayl saqlaganda HMR
      # ishlamay qolsa — quyidagi ikki qatorni oching, `vite.config.ts` ularni o'qib
      # polling rejimiga o'tadi:
      # - CHOKIDAR_USEPOLLING=true
      # - WATCHPACK_POLLING=true
      # Brauzer `/api` ni Vite dev serveridan so'raydi, u esa backendga proxy qiladi.
      # Konteyner ichida `localhost` — konteynerning o'zi, shuning uchun compose
      # tarmog'idagi xizmat nomi (`web`) ishlatiladi.
      - VITE_DEV_API_TARGET=http://web:8000
      - VITE_API_BASE_URL=/api
      - TZ=Asia/Tashkent
    restart: unless-stopped
    depends_on:
      - web

  # 6. Telegram Bot
  bot:
    build: .
    container_name: aiogram_telegram_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python main.py
    restart: always
    depends_on:
      db:
        condition: service_healthy
      logistika-redis:
        condition: service_started
      osrm:
        # service_started emas: konteyner ko'tarilishi bilan OSRM hali marshrut
        # bera olmasligi mumkin — healthcheck o'tguncha kutiladi.
        condition: service_healthy

# Barcha volume'lar bitta joyda jamlandi
volumes:
  postgres_data:
  redis_data: