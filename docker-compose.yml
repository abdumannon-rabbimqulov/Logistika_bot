services:
  # 1. PostgreSQL bazasi
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2103
      - POSTGRES_DB=logistika_db
      - TZ=Asia/Toshkent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis server 
  logistika-redis:
    image: redis:7-alpine
    container_name: logistika-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. FastAPI Web dasturi
  web:
    build: .
    container_name: fastapi_web_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - FORCE_COLOR=1
    command:
      - uvicorn
      - config.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --log-config
      - config/uvicorn_logging.json
    restart: always
    depends_on:
      - db
      - logistika-redis

  # 4. Telegram Bot
  bot:
    build: .
    container_name: aiogram_telegram_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python main.py
    restart: always
    depends_on:
      - db
      - logistika-redis

# Barcha volume'lar bitta joyda jamlandi
volumes:
  postgres_data:
  redis_data: