services:
  # 1. PostgreSQL bazasi
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD .env faylida belgilanishi shart}
      - POSTGRES_DB=${DB_NAME:-logistika_db}
      - TZ=Asia/Tashkent
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Support mikroservizi uchun alohida baza (`support_db`) shu skript bilan
      # yaratiladi. DIQQAT: `/docker-entrypoint-initdb.d` FAQAT bo'sh volume'da,
      # ya'ni birinchi ishga tushishda bajariladi. Bazasi allaqachon bor bo'lsa:
      #   docker compose exec db psql -U postgres -c "CREATE DATABASE support_db"
      - ./scripts/init-support-db.sh:/docker-entrypoint-initdb.d/10-support-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistika_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis server
  logistika-redis:
    image: redis:7-alpine
    container_name: logistika-redis
    restart: always
    ports:
      - "6380:6379"  # Tashqi portni 6380 qildik, shunda Mac-dagi eski Redis bilan urishmaydi!
    volumes:
      - redis_data:/data

  # 3. RabbitMQ — haydovchi qidirish vazifalari navbati
  #
  # Qidiruv (services/dispatch.py) endi HTTP so'rov ichida emas, `dispatch-worker`
  # jarayonida bajariladi. `-management` tegi boshqaruv UI'ni qo'shadi:
  # http://localhost:15672 (guest/guest) — navbat uzunligi va "Unacked" sonini
  # shu yerdan kuzatish mumkin.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: logistika_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      - TZ=Asia/Tashkent
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # boshqaruv UI
    volumes:
      # Navbatlar `durable`, xabarlar `persistent` — broker qayta ishga tushganda
      # kutayotgan vazifalar yo'qolmasligi uchun ma'lumot volume'da saqlanadi.
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # 4. OSRM Router (Xarita serveri)
  #
  # Ma'lumot fayllari `osrm-data/` da (git'ga kirmaydi, ~1 GB). Nomi doim "uzbekistan"
  # — sanasiz, shuning uchun xaritani yangilaganda bu faylni tahrirlash SHART EMAS
  # (`scripts/update-osrm-map.sh` fayllarni shu nom bilan almashtiradi). Qaysi sana
  # yuklanganini `osrm-data/VERSION` dan ko'rish mumkin.
  osrm:
    image: osrm/osrm-backend
    container_name: osrm_router
    platform: linux/amd64        # Apple Silicon Mac-lar uchun majburiy
    volumes:
      # Faqat xarita papkasi va faqat o'qish uchun — ilgari butun loyiha (`.:/data`)
      # ulangan edi, ya'ni .env (BOT_TOKEN, DB_PASSWORD) ham konteynerga ochiq edi.
      - ./osrm-data:/data:ro
    ports:
      - "5001:5000"              # Tashqi portni 5001 qildik, AirPlay bilan urishmaydi!
    # MLD algoritmi .osrm fayllarini o'qiydi (.osm.pbf emas — u faqat manba).
    command: osrm-routed --algorithm mld /data/uzbekistan.osrm
    restart: always
    # `restart: always` faqat jarayon o'lsa qayta ishga tushiradi — osilib qolsa (javob
    # bermay turaveradi) bilmaydi. Healthcheck aynan shuni ushlaydi va `service_healthy`
    # bog'liqligini ishlashga imkon beradi.
    # osrm/osrm-backend image'ida curl/wget/nc yo'q — faqat bash bor, shuning uchun
    # HTTP so'rov bash'ning /dev/tcp imkoniyati orqali yuboriladi. Haqiqiy marshrut
    # so'raladi (shunchaki port ochiqligi emas), ya'ni xarita to'g'ri yuklanganini ham tekshiradi.
    # MUHIM: HTTP/1.1 + "Connection: close" — OSRM aks holda ulanishni ~5s keep-alive
    # bilan ochiq ushlab turadi va `grep` javob oxirini (EOF) kutib timeout'ga uchraydi.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /route/v1/driving/69.24,41.31;69.28,41.33?overview=false HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q ''"code":"Ok"'' <&3'
      interval: 30s
      timeout: 5s
      start_period: 60s        # katta xarita sekin ochilsa ulgurishi uchun
      retries: 3

  # 5. FastAPI Web dasturi
  web:
    build: .
    container_name: fastapi_web_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
      - FORCE_COLOR=1
    command:
      - uvicorn
      - config.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # DIQQAT: bu yerda --reload YO'Q. Reloader qo'shimcha kuzatuvchi jarayon ochadi va
      # har qayta yuklanishda jarayon ichidagi asyncio tasklari (dispatch taymerlari —
      # services/dispatch.py `_expire_after_timeout`) yo'qoladi. Lokal ishlab chiqish
      # uchun `docker-compose.override.yml` da --reload qo'shilgan (u avtomatik qo'llanadi).
    restart: always
    depends_on:
      db:
        condition: service_healthy
      logistika-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      osrm:
        # service_started emas: konteyner ko'tarilishi bilan OSRM hali marshrut
        # bera olmasligi mumkin — healthcheck o'tguncha kutiladi.
        condition: service_healthy

  # 6. Frontend (Vite dev server — hot reload) → http://localhost:5173
  #
  # `src/` host'dan bind-mount qilingan, shuning uchun faylni saqlash bilanoq HMR orqali
  # brauzerda aks etadi — image'ni qayta build qilish shart emas. Kundalik ish shu.
  #
  # Qayta build FAQAT `package.json` / `vite.config.ts` / `index.html` / `tsconfig*`
  # o'zgarganda kerak (ular image ichida): `make fe-rebuild` — ~10 soniya, chunki
  # `npm ci` qatlami va BuildKit npm keshi saqlanadi.
  #
  # Ishlab chiqarish varianti (nginx + statik `dist/`, port 8080) `docker-compose.prod.yml`
  # dagi SHU NOMLI xizmat tomonidan ustiga yoziladi:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
  # Ya'ni dev va prod bitta xizmat nomining ikki rejimi — lokalda faqat 5173 ishlaydi.
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    # Image nomi ATAYLAB aniq berilgan. Aks holda dev ham, prod ham compose'ning standart
    # `<loyiha>-frontend` tegini olardi va `make prod-up --build` dev image'ni jimgina
    # nginx varianti bilan almashtirib qo'yardi — keyin `make fe` nginx'ni ishga tushirib,
    # "host not found in upstream host.docker.internal" bilan tsiklga tushardi.
    image: yuk_frontend_dev:latest
    container_name: yuk_frontend_dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      # FAQAT manba papkalari mount qilinadi — butun `./Frontend` EMAS.
      # Sabab: `node_modules` konteynerning o'zida (image qatlamida) qolishi kerak.
      # Docker Desktop (macOS) bind-mount ichidagi volume'ni ishonchli "yopmaydi",
      # shuning uchun eski `./Frontend:/app` + `/app/node_modules` sxemasida konteyner
      # host'dagi node_modules'ga linux/musl binarlarni yozib, host'dagi `npm run build`
      # ni buzardi (batafsil izoh: Frontend/Dockerfile.dev).
      #
      # Kundalik ish `src/` da kechadi — u mount qilingan, ya'ni HMR darhol ishlaydi.
      - ./Frontend/src:/app/src
      - ./Frontend/public:/app/public
    environment:
      - NODE_ENV=development
      # Polling ATAYLAB o'chirilgan. Eski Docker Desktop bind-mount'da fayl hodisalarini
      # (inotify) yetkazmasdi, shuning uchun chokidar 300ms'da har bir faylni qayta
      # tekshirib turardi — bu bekorga CPU yeydi. Hozirgi Docker Desktop (VirtioFS)
      # hodisalarni to'g'ri uzatadi va HMR polling'siz ham ishlaydi (tekshirilgan).
      #
      # Agar biror muhitda (eski Docker, Windows/WSL1, tarmoq disk) fayl saqlaganda HMR
      # ishlamay qolsa — quyidagi ikki qatorni oching, `vite.config.ts` ularni o'qib
      # polling rejimiga o'tadi:
      # - CHOKIDAR_USEPOLLING=true
      # - WATCHPACK_POLLING=true
      # Brauzer `/api` ni Vite dev serveridan so'raydi, u esa backendga proxy qiladi.
      # Konteyner ichida `localhost` — konteynerning o'zi, shuning uchun compose
      # tarmog'idagi xizmat nomi (`web`) ishlatiladi.
      - VITE_DEV_API_TARGET=http://web:8000
      # Support alohida mikroservis — compose tarmog'ida "support" nomi bilan 8000-portda
      # (tashqariga 8010 sifatida chiqadi). Vite `/support` ni shu manzilga uzatadi.
      - VITE_DEV_SUPPORT_TARGET=http://support:8000
      # Buyurtma sahifasidagi Leaflet xaritasi marshrutni brauzerdan so'raydi
      # (`/osrm/...`), Vite esa uni OSRM konteyneriga uzatadi. Konteyner ichida
      # port 5000 (tashqi 5001 emas).
      - VITE_DEV_OSRM_TARGET=http://osrm:5000
      - VITE_API_BASE_URL=/api
      - TZ=Asia/Tashkent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    # `depends_on: web` ATAYLAB YO'Q. Vite backendga faqat brauzerdan `/api` so'rovi
    # kelganda murojaat qiladi — ishga tushish paytida `web` kerak emas. Bog'liqlik
    # bo'lganda esa zanjir `web → osrm (service_healthy)` gacha cho'zilardi: OSRM Apple
    # Silicon'da amd64 emulyatsiyasida, ~1 GB xarita bilan daqiqalab ko'tariladi.
    # Endi `docker compose up -d frontend` bir necha soniyada tayyor bo'ladi;
    # backend keyinroq ko'tarilsa ham frontend uni o'zi topadi.

  # 7. Telegram Bot
  bot:
    build: .
    container_name: aiogram_telegram_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python main.py
    restart: always
    depends_on:
      db:
        condition: service_healthy
      logistika-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      osrm:
        # service_started emas: konteyner ko'tarilishi bilan OSRM hali marshrut
        # bera olmasligi mumkin — healthcheck o'tguncha kutiladi.
        condition: service_healthy

  # 8. Dispatch worker — haydovchi qidirish navbatini qayta ishlaydi
  #
  # `web` va `bot` faqat vazifani navbatga qo'yadi, qidiruvning o'zi shu yerda ketadi.
  # Yuk oshsa `--scale dispatch-worker=N` bilan ko'paytirish mumkin: navbat bitta,
  # xabarlar worker'lar orasida taqsimlanadi, bir order ikki marta qidirilib
  # ketmasligini Redis qulfi + DB holati ta'minlaydi (services/dispatch.py).
  #
  # Bu yerda ham `--reload` YO'Q va bo'lmasligi kerak: reloader qayta yuklanganda
  # ochiq AMQP kanali uziladi va ishlov berilayotgan xabarlar ack qilinmay qoladi.
  dispatch-worker:
    build: .
    container_name: logistika_dispatch_worker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python -m workers.dispatch_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      logistika-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      osrm:
        # Yo'lga chiqish vaqtini hisoblash uchun OSRM kerak (resolve_departure_plan).
        condition: service_healthy

  # 9. Support (Yordam) mikroservizi → http://localhost:8010/docs
  #
  # ALOHIDA xizmat: o'z image'i (`support_service/Dockerfile`, ichida faqat
  # `support_service/` papkasi), o'z bazasi (`support_db`) va o'z bog'liqliklari.
  # Asosiy ilova bilan faqat ikki narsani baham ko'radi:
  #   1. `SECRET_KEY` — JWT ni mahalliy tekshirish uchun (rol tokendagi `role` claim'ida)
  #   2. RabbitMQ `logistika.events` exchange'i — hodisalar almashinuvi
  # Asosiy bazaga ulanmaydi va `web` ga HTTP so'rov yubormaydi, shuning uchun
  # `depends_on: web` ham yo'q — ikkalasi mustaqil ko'tariladi.
  support:
    build:
      context: .
      dockerfile: support_service/Dockerfile
    container_name: logistika_support
    ports:
      - "${SUPPORT_SERVICE_PORT:-8010}:8000"
    environment:
      - SUPPORT_DB_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${SUPPORT_DB_NAME:-support_db}
      # Asosiy ilova bilan BIR XIL bo'lishi shart, aks holda token tekshiruvi yiqiladi.
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Tashkent
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 10. Events worker — support hodisalarini adminlarga yetkazadi
  #
  # `support.notifications` navbatini o'qiydi va yangi murojaat / javob haqida
  # Telegram orqali adminlarga xabar beradi. Nega support o'zi yubormaydi: unda
  # `BOT_TOKEN` ham, adminlar ro'yxati ham yo'q va bo'lmasligi kerak.
  events-worker:
    build: .
    container_name: logistika_events_worker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Asia/Tashkent
    command: python -m workers.events_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# Barcha volume'lar bitta joyda jamlandi
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: